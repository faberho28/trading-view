# Non-secret configuration. Anything a reviewer should see in the diff goes here;
# anything that leaks money (API keys) goes in .env instead.

watchlist:
  - symbol: AAPL
    sector: tech
  - symbol: MSFT
    sector: tech
  - symbol: SPY
    sector: index
  - symbol: NVDA
    sector: tech
  - symbol: GOOGL
    sector: tech

bar_timeframe: "1H"
lookback_bars: 200

# Signal confirmation filters (added 2026-09-21): a raw pivot breakout alone
# fires on any noise; these require trend agreement, above-average volume,
# and a level tested more than once before treating a breakout as real.
trend_ma_period: 50                 # bars for the trend-direction moving average
volume_lookback: 20                 # bars averaged for the "normal" volume baseline
volume_confirmation_multiplier: 1.2 # breakout bar's volume must exceed baseline * this
min_level_touches: 2                # a level must recur at least this many times
level_touch_tolerance_pct: 0.003    # price band (0.3%) to treat two pivots as the same level

# Risk guardrail thresholds (Requirement 3, spec)
max_risk_per_trade_pct: 0.01        # 1% of equity
max_position_value_pct: 0.10        # 10% of equity
daily_loss_cap_pct: 0.03            # -3% of equity halts new trades for the session
max_open_positions: 5
min_reward_risk_ratio: 2.0
correlation_basket_max: 2           # max concurrent positions per correlated basket
slippage_max_pct: 0.003             # 0.3%
market_edge_buffer_minutes: 5       # skip trades within 5 min of open/close
kill_switch_consecutive_losses: 3
kill_switch_api_errors: 5
kill_switch_api_error_window_minutes: 15
# Safety net (added 2026-09-25): if an open position's stop-loss order is
# ever found missing (cancelled by hand, by Alpaca, or otherwise), the
# orchestrator re-attaches a fresh stop at this distance from avg entry
# price — independent of whatever stop distance the strategy originally
# intended, since that price is lost once the original bracket leg is gone.
protective_stop_fallback_pct: 0.01

audit_log_path: "logs/audit.jsonl"
